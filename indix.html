<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="front-container">

        <div class="hero">
            <img src="images.jpg" alt="Quiz Banner">
            <h1>Create a question for your audience!</h1>
            <p>Test your knowledge across categories!</p>
        </div>

        <div class="quiz-container">
            <button id="startQuizBtn">Open</button>
            <p class="instructions">Click the button above to begin.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
